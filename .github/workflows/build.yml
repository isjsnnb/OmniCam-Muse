name: Build Muse APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" || \
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --licenses || true

      - name: Grant gradlew
        run: chmod +x ./gradlew

      - name: Build release
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon -x lint

      - name: Locate APK
        run: |
          find app/build/outputs -name "*.apk" -o -name "*.aab" | head -20
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
