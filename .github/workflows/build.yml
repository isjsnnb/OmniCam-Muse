name: Build Muse APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Install missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;29.0.14206865" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- ndk ---"; ls "$SDK/ndk" || true

      - name: Fix CRLF line endings
        run: |
          sed -i 's/\r$//' gradlew
          find module tools -name '*.sh' -exec sed -i 's/\r$//' {} \; 2>/dev/null || true
          chmod +x gradlew
          echo "shebang: $(head -1 gradlew | od -c | head -1)"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/port.keystore" \
            -alias musepk \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass musepass -keypass musepass \
            -dname "CN=Muse PKC110, OU=port, O=local, L=CN, ST=CN, C=CN"
          ls -lh port.keystore

      - name: Build release (signed)
        env:
          OMNICAM_KEYSTORE: port.keystore
          OMNICAM_STORE_PASSWORD: musepass
          OMNICAM_KEY_ALIAS: musepk
          OMNICAM_KEY_PASSWORD: musepass
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain --no-daemon --stacktrace 2>&1 | tee /tmp/build.log | tail -150

      - name: Show failure summary
        if: failure()
        run: |
          tail -200 /tmp/build.log || true
          grep -E "error:|FAILURE|What went wrong|Caused by|Could not|Cannot" /tmp/build.log | head -60 || true

      - name: Locate and verify APK
        if: always()
        run: |
          find app/build/outputs -name "*.apk" 2>/dev/null || true
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || true
          APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "=== signature check ==="
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
            "$BT/apksigner" verify --print-certs "$APK" 2>&1 | head -10 || echo "apksigner not found"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
